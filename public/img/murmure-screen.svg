<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Aperçu de l'application Murmure">
  <rect width="390" height="844" fill="#14171f"/>

  <!-- barre d'état -->
  <text x="28" y="46" fill="#8f8b80" font-family="Arial, sans-serif" font-size="13" font-weight="600">21:04</text>
  <circle cx="342" cy="41" r="3" fill="#8f8b80"/>
  <circle cx="353" cy="41" r="3" fill="#8f8b80"/>
  <rect x="362" y="36" width="16" height="9" rx="2" fill="none" stroke="#8f8b80" stroke-width="1.4"/>

  <!-- logo -->
  <text x="195" y="120" fill="#d3cdc0" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="7" text-anchor="middle">murmure</text>
  <line x1="160" y1="150" x2="230" y2="150" stroke="#2b2f39" stroke-width="1"/>

  <!-- label -->
  <text x="195" y="242" fill="#807b70" font-family="Arial, sans-serif" font-size="12" letter-spacing="3" text-anchor="middle">LA QUESTION DU JOUR</text>

  <!-- question -->
  <text text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" fill="#efe9dd" font-size="31">
    <tspan x="195" y="332">Qu'est-ce que tu</tspan>
    <tspan x="195" y="376">n'as jamais osé</tspan>
    <tspan x="195" y="420">dire à voix haute ?</tspan>
  </text>

  <!-- champ réponse -->
  <rect x="40" y="516" width="310" height="150" rx="16" fill="none" stroke="#2b2f39" stroke-width="1.5"/>
  <text x="62" y="552" fill="#6a685f" font-family="Arial, sans-serif" font-size="15">Ta réponse, anonyme…</text>

  <!-- bouton -->
  <rect x="40" y="700" width="310" height="54" rx="27" fill="#efe9dd"/>
  <text x="195" y="734" fill="#14171f" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">RÉPONDRE</text>

  <!-- pied -->
  <text x="195" y="806" fill="#5c5b54" font-family="Arial, sans-serif" font-size="11" letter-spacing="0.5" text-anchor="middle">Anonyme · Une seule question · Aucun like</text>
</svg>
