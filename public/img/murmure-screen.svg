<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Aperçu de l'application Murmure">
  <rect width="390" height="844" fill="#1c1e15"/>

  <!-- barre d'état -->
  <text x="28" y="46" fill="#8b8a76" font-family="Arial, sans-serif" font-size="13" font-weight="600">15:26</text>
  <circle cx="342" cy="41" r="3" fill="#8b8a76"/>
  <circle cx="353" cy="41" r="3" fill="#8b8a76"/>
  <rect x="362" y="36" width="16" height="9" rx="2" fill="none" stroke="#8b8a76" stroke-width="1.4"/>

  <!-- label -->
  <text x="195" y="150" fill="#8f8d78" font-family="Arial, sans-serif" font-size="11.5" letter-spacing="2.5" text-anchor="middle">QUESTION DU JOUR · UNIVERSELLES</text>
  <line x1="165" y1="176" x2="225" y2="176" stroke="#33362a" stroke-width="1"/>

  <!-- question -->
  <text text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" fill="#e9e5d6" font-size="27">
    <tspan x="195" y="300">C'est quoi une chose</tspan>
    <tspan x="195" y="340">dont on n'a pas besoin</tspan>
    <tspan x="195" y="380">mais qu'on croit</tspan>
    <tspan x="195" y="420">indispensable ?</tspan>
  </text>

  <text x="195" y="486" fill="#6d6c5c" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Réponds anonymement, en une phrase.</text>

  <!-- bouton principal -->
  <rect x="40" y="616" width="310" height="56" rx="28" fill="#f2efe4"/>
  <text x="195" y="651" fill="#1c1e15" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1" text-anchor="middle">Répondre</text>

  <!-- actions secondaires -->
  <text x="195" y="712" fill="#8b8a76" font-family="Arial, sans-serif" font-size="13.5" text-anchor="middle">Voir les réponses du jour</text>
  <line x1="120" y1="748" x2="270" y2="748" stroke="#2a2c21" stroke-width="1"/>
  <text x="195" y="784" fill="#5f5e50" font-family="Arial, sans-serif" font-size="11.5" letter-spacing="0.5" text-anchor="middle">Anonyme · Une seule question · Aucun like</text>
</svg>
